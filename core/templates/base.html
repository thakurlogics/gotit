{% load static %}
<!DOCTYPE html>
<html>
<head>    
    <title>{{ settings.company_name|default:"ThakurLogics" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">        
        <a class="navbar-brand fw-bold" href="/"><img src="{% static 'images/logo.png' %}" alt="Logo" width="150"></a>
        {{ settings.company_name|default:"ThakurLogics" }}
        <div>
            <a class="nav-link d-inline text-white" href="/">Home</a> | 
            <a class="nav-link d-inline text-white" href="/about/">About</a> | 
            <a class="nav-link d-inline text-white" href="/services/">Services</a> | 
            <a class="nav-link d-inline text-white" href="/contact/">Contact</a>
        </div>
    </div>
</nav>

<div class="container py-5">    
    
    {% block content %}{% endblock %}
</div>

<footer class="bg-dark text-white text-center py-3">
    © 2026 {{ settings.company_name|default:"ThakurLogics" }}
    
</footer>

</body>
</html>
