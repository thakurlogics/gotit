{% extends 'base.html' %}

{% block content %}
<h1>Our Services</h1>

<div class="row mt-4">
    {% for service in services %}
    <div class="col-md-4 mb-4">
        <div class="card p-4">
            <h4>{{ service.title }}</h4>
            <p>{{ service.description }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
