{% extends 'base.html' %}

{% block content %}
<h1>Contact Us</h1>

<form method="post" class="mt-4">
    {% csrf_token %}
    <div class="mb-3">
        {{ form.name.label }} 
        {{ form.name }}
    </div>
    <div class="mb-3">
        {{ form.email.label }} 
        {{ form.email }}
    </div>
    <div class="mb-3">
        {{ form.message.label }} 
        {{ form.message }}
    </div>

    <button type="submit" class="btn btn-primary">Send Message</button>
</form>
{% endblock %}
